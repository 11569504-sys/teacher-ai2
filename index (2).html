<html lang="zh-Hant">
<head>

<title>教學 AI 工具箱</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ee;--card:#fff;--ink:#2b2a27;--mute:#77736a;--line:#e4dfd2;--acc:#3f7d6b;--acc-ink:#fff;--chip:#eef3ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1a;--card:#262826;--ink:#ecebe6;--mute:#a09c92;--line:#3a3c38;--acc:#6bb59f;--acc-ink:#12201b;--chip:#2e332f}}
:root[data-theme="dark"]{--bg:#1b1c1a;--card:#262826;--ink:#ecebe6;--mute:#a09c92;--line:#3a3c38;--acc:#6bb59f;--acc-ink:#12201b;--chip:#2e332f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.65}
header{background:var(--acc);color:var(--acc-ink);padding:30px 16px 24px;text-align:center}
header h1{margin:0 0 4px;font-size:1.7rem}header p{margin:0;opacity:.9}
main{max-width:860px;margin:0 auto;padding:18px 16px 48px}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 8px;border-radius:12px;cursor:pointer;font:inherit;font-size:.88rem;text-align:center}
.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tab span{display:block;font-size:1.3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 2px;font-size:1.25rem}.desc{color:var(--mute);margin:0 0 14px;font-size:.93rem}
label{display:block;font-weight:600;margin:12px 0 5px;font-size:.92rem}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
button.go{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
button.go:disabled{opacity:.6;cursor:wait}
.out{min-height:40px;overflow-x:auto}.out.pre{white-space:pre-wrap}
.out table{border-collapse:collapse;width:100%;min-width:480px}
.out th,.out td{border:1px solid var(--line);padding:6px 8px;text-align:center;font-size:.9rem}
.out th{background:var(--chip)}
.out h3,.out h4{margin:14px 0 6px}
.out ul{margin:4px 0;padding-left:1.3em}
.out.tree ul{border-left:2px solid var(--acc);margin-left:4px}
.out.tree>ul{border:0;padding-left:0;list-style:none}
.out.tree li{margin:3px 0}
.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bar button{padding:8px 14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;cursor:pointer;font:inherit}
details{margin-top:12px;color:var(--mute);font-size:.88rem}
details pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:10px;color:var(--ink);font-family:inherit}
.warn{color:#b3472f;font-size:.9rem;margin:8px 0 0}
.hint{color:var(--mute);font-size:.82rem;margin-top:4px}
#proj{position:fixed;inset:0;background:#1f3a2e;color:#f4f1e6;z-index:99;display:none}
#proj.on{display:block}
#pt{height:100%;margin:0;padding:4vh 4vw;writing-mode:vertical-lr;text-orientation:upright;overflow-x:auto;overflow-y:hidden;white-space:pre-wrap;line-height:1.6;letter-spacing:.08em;font-family:"標楷體","DFKai-SB","Noto Serif TC",serif}
#pc{position:fixed;top:10px;right:12px;display:flex;gap:6px;z-index:100}
#pc button{padding:6px 12px;border-radius:8px;border:1px solid #f4f1e655;background:#00000055;color:#f4f1e6;font:inherit;cursor:pointer}
#tool.pa-on{padding:0;border:0;background:transparent}
.pa{--b:#0c0c0e;--bd:#2e2e33;--tx:#f4f3f8;--mu:#9a98a6;--ac:#a9a6d6;--aci:#1a1830;--sg:#101012;--cb:#17171a;
 background:linear-gradient(135deg,#1b1b1e,#2b2b30 45%,#0d0d0f);color:var(--tx);border:1px solid #34343a;border-radius:20px;padding:20px}
.pa[data-th=light]{--b:#fff;--bd:#d9d6e6;--tx:#25233a;--mu:#7a7790;--ac:#7f7bc4;--aci:#fff;--sg:#ecebf5;--cb:#fff;background:linear-gradient(135deg,#f4f3fb,#e6e4f4);border-color:#d6d3ea}
.pah{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pat{font-size:1.25rem;font-weight:700}
#pth{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--sg);color:var(--tx);cursor:pointer;font-size:1.1rem}
.seg{display:flex;gap:4px;background:var(--sg);border:1px solid var(--bd);border-radius:14px;padding:5px;margin-bottom:14px}
.seg button{flex:1;padding:11px 6px;border:0;border-radius:10px;background:transparent;color:var(--mu);font:inherit;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--aci)}
.sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.sc[hidden]{display:none}
.sb{padding:10px 6px;border-radius:12px;border:1px solid var(--bd);background:var(--cb);color:var(--tx);font:inherit;font-size:.9rem;cursor:pointer}
.sb.on{background:var(--ac);color:var(--aci);border-color:var(--ac);font-weight:700}
.pl{font-weight:700;margin:6px 0 8px;display:block}
.pa textarea{background:var(--b);border-color:var(--bd);color:var(--tx);min-height:140px;border-radius:14px}
.pa .go{background:linear-gradient(180deg,#55555c,#2a2a2f);color:#fff;border:2px solid #8d8d96;border-radius:999px;margin-top:16px}
.pa[data-th=light] .go{background:linear-gradient(180deg,#8f8bd2,#7370b8);border-color:#6a67ad}
.pa details{color:var(--mu)}.pa details pre{background:var(--b);border-color:var(--bd);color:var(--tx)}
.foot{color:var(--mute);font-size:.85rem;text-align:center;margin-top:20px}
</style>
</head>

function md(s,tree){
  const lines=esc(s).split('\n');let o='',inT=0,stack=[];
  const closeL=to=>{while(stack.length>to){o+='</ul>';stack.pop()}};
  const inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  lines.forEach(L=>{
    let m;
    if(/^\s*\|/.test(L)){closeL(0);if(/^\s*\|[\s:\-|]+\|\s*$/.test(L))return;
      const c=L.trim().replace(/^\||\|$/g,'').split('|').map(x=>inl(x.trim()));
      if(!inT){o+='<table>';inT=1;o+='<tr>'+c.map(x=>`<th>${x}</th>`).join('')+'</tr>'}else o+='<tr>'+c.map(x=>`<td>${x}</td>`).join('')+'</tr>';return}
    if(inT){o+='</table>';inT=0}
    if(m=L.match(/^(\s*)[-*•]\s+(.*)/)){const lv=Math.floor(m[1].length/2)+1;
      while(stack.length<lv){o+='<ul>';stack.push(1)}closeL(lv);o+=`<li>${inl(m[2])}</li>`;return}
    closeL(0);
    if(m=L.match(/^#{1,4}\s*(.*)/))o+=`<h3>${inl(m[1])}</h3>`;
    else if(L.trim())o+=`<p style="margin:6px 0">${inl(L)}</p>`;
  });
  closeL(0);if(inT)o+='</table>';return o;
}
function show(text,done){

}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=()=>no(new Error('檔案讀取失敗'));r.readAsDataURL(f)});
async function imgB64(f){
  let src;
  try{src=await createImageBitmap(f)}
  catch(_){
    const u=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
    src=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('load'));i.src=u});
  }
  const w=src.width,h=src.height,k=Math.min(1,1600/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.85).split(',')[1];
}
async function readFiles(list){
  const files=[];let extra="";
  if(list.length>3)throw new Error('最多上傳 3 個檔案');
  for(const f of list){
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(f.type.startsWith('image/')||['jpg','jpeg','png','webp','heic','heif'].includes(ext)){
      try{files.push({mime:'image/jpeg',data:await imgB64(f)})}
      catch(err){
        const mt=f.type||({heic:'image/heic',heif:'image/heif',png:'image/png',webp:'image/webp',jpg:'image/jpeg',jpeg:'image/jpeg'})[ext];
        if(['image/heic','image/heif','image/png','image/webp','image/jpeg'].includes(mt)&&f.size<=6e6)files.push({mime:mt,data:await b64(f)});
        else throw new Error('此圖片無法讀取（'+(f.type||ext)+'，'+Math.round(f.size/1024)+'KB）。若檔案超過 6MB，請先縮小或截圖後再上傳');
      }
    }
    else if(f.type==='application/pdf'){if(f.size>6e6)throw new Error('PDF 請小於 6MB');files.push({mime:'application/pdf',data:await b64(f)})}
    else if(f.type.startsWith('text/')||/\.(txt|md)$/i.test(f.name))extra+=(await f.text()).slice(0,8000)+'\n';
    else throw new Error('不支援此格式，請改用圖片、PDF 或 TXT（Word 檔請先另存成 PDF）');
  }
  return {files,extra};
}

async function gen(){
  const err=$('err');err.hidden=true;
  if(cur.id==='pa'){
    if($('f_mode').value==='手動選擇情境'&&!$('f_sc').value){err.textContent='請先選擇一個情境。';err.hidden=false;return}
    if(!$('f_msg').value.trim()){err.textContent='請先描述現況或貼上訊息。';err.hidden=false;return}
  }
  const fields=cur.f.filter(f=>f[2]!=="file");
  const vals=fields.map(f=>[f[1],$('f_'+f[0]).value.trim()]);
  const fin=cur.f.find(f=>f[2]==="file");let files=[],extra="";
  if(fin){try{({files,extra}=await readFiles($('f_'+fin[0]).files))}catch(e){err.textContent=e.message||'檔案讀取失敗';err.hidden=false;return}}
  if(!vals.some((v,i)=>fields[i][2]!=="sel"&&v[1])&&!files.length&&!extra){err.textContent='請先填寫內容。';err.hidden=false;return}
  const prompt=`${cur.r}\n${COMMON}\n${cur.md?'可使用 Markdown 格式。':'請輸出純文字，不要使用 Markdown 符號。'}\n\n【使用者輸入】\n`+vals.map(v=>`${v[0]}：${v[1]||'（未提供）'}`).join('\n')+(extra?'\n【上傳的文字檔內容】\n'+extra:'')+(files.length?'\n（另附上傳的圖片或檔案，請先辨識其中內容並作為主要來源；若是手寫或拍照，看不清楚處請以【?】標示。）':'');
  const go=$('go');go.disabled=true;go.textContent='生成中…';$('again').disabled=true;
  $('resCard').hidden=false;show('思考中…',false);
  try{
    if(API_URL.includes('請換成'))throw new Error('PLACEHOLDER');
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,files})});
    const j=await res.json().catch(()=>({}));if(!res.ok||!j.text)throw Object.assign(new Error(j.error||'error'),{detail:j.detail,status:res.status});
    last=j.text.trim();show(last,true);
  }catch(e){
    $('resCard').hidden=true;
    let m;
    if(e.message==='PLACEHOLDER')m='網頁裡的 API_URL 還沒換成你的 Worker 網址。';
    else if(e instanceof TypeError)m='連不到 Worker：請檢查 API_URL 是否正確，以及 Worker 的 ALLOWED_ORIGIN 是否和網站網址一致。';
    else m='生成失敗（'+(e.status||'')+' '+(e.message||'')+'）'+(e.detail?'：'+e.detail:'');
    err.textContent=m;err.hidden=false;
  }finally{go.disabled=false;go.textContent=go.dataset.l||'✨ 開始生成';$('again').disabled=false}
}
